    <!-- Canonical URL resolution -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var path = window.location.pathname;
          var fullUrl = origin + path;
          
          var canonicalLink = document.createElement('link');
          canonicalLink.setAttribute('rel', 'canonical');
          canonicalLink.setAttribute('href', fullUrl);
          document.head.appendChild(canonicalLink);
          
          // Ensure absolute image and URL for external crawlers
          var ogUrlMeta = document.createElement('meta');
          ogUrlMeta.setAttribute('property', 'og:url');
          ogUrlMeta.setAttribute('content', fullUrl);
          document.head.appendChild(ogUrlMeta);

          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.content.startsWith('/')) {
            ogImg.content = origin + ogImg.content;
          }
          var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogSecImg && ogSecImg.content.startsWith('/')) {
            ogSecImg.content = origin + ogSecImg.content;
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && twImg.content.startsWith('/')) {
            twImg.content = origin + twImg.content;
          }
        } catch (e) {}
      })();
    </script>
